[project]
name = "canon-photo-recovery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ines-Trigueiro", email = "m.ines.trigueiro@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=12.3.0",
]

[project.scripts]
canon-photo-recovery = "canon_photo_recovery:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
